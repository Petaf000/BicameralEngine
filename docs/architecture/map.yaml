      - { id: gpuconductionhlsl, group: shared, label: "multires_conduct.hlsli<br/>1 ブロックの印・流れ・足す(Compute と Work Graph で共有)",
          code: "shaders/sim/multires_conduct.hlsli::AddCellFlows", ticket: T-0107, doc: docs/design/17-multiresolution.md }
      - { id: gpuconductiontest, group: tests, label: "gpu_multires_conduction_test<br/>鎖・たくさんの要求の伝導を毎刻み GPU と CPU で比べる",
          code: "tests/gpu_multires_conduction_test.cpp::RunScene", ticket: T-0107,
          note: "全部 / 活性(伝導の段が Compute / Work Graph)。HW・WARP。release では Compute と Work Graph の時間も測る(D-302)。--subcycle で小刻み 64 回(T-0109)" }
      - { id: implicitcpu, group: simlib, label: "StepImplicit<br/>細かいレベルの熱の陰解法の試作(V サイクル・誤差の見込みで止める・安全網)",
          code: "engine/src/sim/implicit_conduction.cpp::StepImplicit", ticket: T-0110, doc: docs/decisions/ADR-0019-implicit-conduction-flows.md,
          note: "方式②の CPU リファレンス(セルの一覧・熱容量一定。木への組み込みは T-0119)。近似解の面の流れで足すので保存はビット単位" }
      - { id: implicittree, group: simlib, label: "AddImplicitConduction<br/>細かいレベルの熱の陰解法を木の伝導に(案 a)",
          code: "engine/src/sim/multires_implicit_conduction.cpp::AddImplicitConduction", ticket: T-0119, doc: docs/decisions/ADR-0019-implicit-conduction-flows.md,
          note: "options.implicitConduction(既定 false)。流れを計算する側が基準より細かい(Δk 1〜8)面を陰解法の 1 刻みで解く。境の基準以下のセルは面で分ける。眠っている頁のブロックも入れて活性 = 全部。captureImplicitGrid で系を写せる(GPU と比べる。T-0127)。系を GPU で作るのは T-0129、GPU の伝導の段から呼ぶのは GpuMultiresImplicit(T-0132)" }
      - { id: implicittreetest, group: tests, label: "multires_implicit_tree_test<br/>木の物差し・熱い点・鎖・たくさんの要求(保存・活性 = 全部・2 回一致)",
          code: "tests/multires_implicit_tree_test.cpp::CheckChain", ticket: T-0119 }
      - { id: implicithlsl, group: shared, label: "implicit_conduction.hlsli<br/>陰解法の式(温度・面の流れ・誤差の判定・陽解法の係数)",
