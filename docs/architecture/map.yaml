  - id: data
    title: データの流れ(計画)
    description: >-
      ゲームを作る人が触るものは全部 Luau(D-318)。エディタが整数の表にベイクし(保存則を検査)、GPU に載せる。
      世界は決定的な生成 + 差分(D-312)。魔法は刻みの境界で適用される表へのパッチ(コマンド)。
    direction: LR
    groups:
      - { id: tool, label: "エディタ・ツール(CPU を好きなだけ使う)" }
      - { id: rt, label: "ランタイム(GPU)" }
    nodes:
      - { id: luau, group: tool, status: planned, label: "反応則・生き物・進行を書く<br/>(Luau)",
          doc: docs/design/13-scripting-game-model.md }
      - { id: bake, group: tool, label: "ベイク(整数)<br/>元素とエネルギーの釣り合いを検査",
          code: "engine/src/sim/reaction_table.cpp::BakeReactionTable", ticket: T-0014,
          doc: docs/design/02-reaction-system.md, note: "ベイクも fixed.hlsli で計算する(R7)。今は C++ に手で書いた定義から(Luau は M2)" }
      - { id: table, group: rt, status: planned, label: "反応表・物質の表<br/>(版つきのバイナリ)", ticket: T-0002 }
      - { id: gen, group: rt, status: planned, label: "決定的な生成(シード)+ 差分", doc: docs/design/05-world-data.md }
      - { id: vram, group: rt, status: planned, label: "多重解像度の疎な木<br/>(VRAM 常駐の世界)",
          doc: docs/design/17-multiresolution.md }
      - { id: magic, group: rt, status: planned, label: "魔法<br/>= 表へのパッチ + 魔素を使う放出", doc: docs/design/02-reaction-system.md }
      - { id: save, group: tool, label: "セーブ・再生ファイル<br/>(差分 + コマンドの列)",
          code: "engine/src/save/replay_file.cpp::SerializeReplay", ticket: T-0086, doc: docs/design/15-save-replay-mods.md,
          note: "再生ファイルの骨組みは T-0086(仮の世界)。セーブ(差分の書き出し)は後" }
    edges:
      - [luau, bake]
      - [bake, table]
      - [table, vram]
      - [gen, vram]
