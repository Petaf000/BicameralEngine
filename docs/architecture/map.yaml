  # ---------------------------------------------------------------------------------------------
  - id: frame
    title: 1 刻みとフレーム(計画)
    description: >-
      世界の状態と因果はすべて GPU(D-107)。CPU は入力をコマンドにして積み、Present するだけ。
      シミュは compute キュー、描画は direct キューで並べて走らせ、同期は GPU のフェンスだけ。
      1 刻み = 世界時間 1/60 秒。重いと世界の時間が遅くなるが、結果は変わらない(D-202・D-409)。
    direction: TD
    groups:
      - { id: cpu, label: "CPU(View と Controller)" }
      - { id: sim, label: "GPU の 1 刻み(compute キュー。docs/design/06 §2 の段)" }
      - { id: view, label: "GPU の描画(direct キュー)" }
    nodes:
      - { id: input, group: cpu, label: "入力 → コマンド<br/>(適用する刻みつき)", ticket: T-0004,
          code: "engine/src/frame/frame_loop.cpp::FrameLoop::QueueClicks", doc: docs/design/06-simulation-loop.md }
      - { id: present, group: cpu, label: "Present", ticket: T-0004,
          code: "engine/src/frame/frame_loop.cpp::FrameLoop::RunFrame" }
      - { id: audio, group: cpu, status: planned, label: "音・UI<br/>(リングを 1〜3 フレーム遅れで読む)",
          doc: docs/design/11-audio.md }
      - { id: command, group: sim, label: "1 コマンド適用<br/>GPU のキューから (刻み, 番号) の順", ticket: T-0086,
          code: "shaders/sim/probe_tick.hlsl::ApplyCommand", doc: docs/design/06-simulation-loop.md,
          note: "M1 は仮の世界の「つつき」だけ" }
      - { id: active, group: sim, label: "2 活性の整理<br/>Work Graphs", ticket: T-0005,
          code: "shaders/sim/probe_conduct.hlsl::TrySchedule", doc: docs/design/05-world-data.md,
          note: "M1 は仮の世界の 4³ ブロック: 前の刻みで変わったブロック + つつかれたブロック + 6 面の隣。疎な木は T-0018" }
      - { id: transport, group: sim, label: "3 輸送(熱・気体・水・魔素)<br/>測って安い方(D-302)",
          ticket: T-0089, code: "shaders/common/heat_conduction.hlsli::HcFaceFlow", doc: docs/design/07-transport.md,
          note: "M1 は熱の伝導だけ(温度の差・物質ごとの伝導率・断熱の箱。反応と同じノード。Work Graph の版だけ。Compute との比較は輸送の本物の段で)" }
      - { id: react, group: sim, label: "4 反応<br/>1 セルの評価(伝導と同じノード)",
          code: "shaders/common/probe_world.hlsli::ProbeStepCell", ticket: T-0089, doc: docs/design/02-reaction-system.md,
          note: "核は T-0014(reaction.hlsli)。T-0089 で仮の世界の段に: 伝導の後にその場で評価。遅すぎる反応は 0 なので、進めないブロックは眠れる" }
      - { id: physics, group: sim, status: research, label: "5 物理(整数の AVBD)<br/>接触生成 → ソルバー",
          doc: docs/design/08-bodies-physics.md, ticket: T-0092, code: "engine/src/sim/gpu_physics.cpp::GpuPhysics::RecordStep",
          note: "研究 R-PHYS。CPU の世界は T-0016(PhysicsWorld)。GPU の Compute は T-0090(CPU とビット一致)。Work Graphs 版と測って選ぶのは T-0092。世界の刻みへの組み込みは未" }
      - { id: creatures, group: sim, status: planned, label: "6 生き物", doc: docs/design/09-creatures-animation.md }
      - { id: couple, group: sim, status: planned, label: "7 結合(物 ↔ 場)", doc: docs/design/08-bodies-physics.md }
      - { id: coarse, group: sim, status: planned, label: "8 粗い層(60 刻みに 1 回)", doc: docs/design/05-world-data.md }
      - { id: check, group: sim, label: "9 検査と出力<br/>保存則・状態のハッシュ・イベントを並べてリングへ", ticket: T-0086,
          code: "shaders/sim/probe_tick.hlsl::SortEventKeys", doc: docs/design/16-debug-test.md,
          note: "状態のハッシュ(T-0012)・イベントの並べ替え(T-0086)・熱の合計(T-0005)" }
      - { id: ring, group: sim, label: "GPU → CPU の待たないリング<br/>イベント・スナップショット・デバッグ",
          ticket: T-0004, code: "engine/src/gpu/readback_ring.cpp::ReadbackRing::RecordReadbackAndReset" }
      - { id: extract, group: view, status: planned, label: "描画用の抽出(3 組)", doc: docs/design/10-rendering.md,
          note: "T-0004 の仮の世界では 3 組で描画がシミュを待たないことを確かめた。T-0015 で全部のセル + ブロックの活性の印に" }
      - { id: draw, group: view, status: planned, label: "Visibility Buffer・PBR・ReSTIR", doc: docs/design/10-rendering.md }
      - { id: math, group: sim, label: "整数の数学ライブラリ<br/>(全部の段が使う)", code: "shaders/common/fixed.hlsli::FxMulU64Full",
          ticket: T-0010 }
    edges:
      - [input, command, "コマンドキュー"]
      - [command, active]
      - [active, transport]
      - [transport, react]
      - [react, physics]
      - [physics, creatures]
      - [creatures, couple]
      - [couple, coarse]
      - [coarse, check]
      - [check, ring]
      - [check, extract]
      - [extract, draw]
      - [draw, present]
      - [ring, audio, "", async]
      - [react, math]

