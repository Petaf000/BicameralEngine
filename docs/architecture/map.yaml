# アーキテクチャ図の定義(T-0006 案 C)。tools/archmap/archmap.py がこれを読んでページを作る。
#
# ノード:
#   id      図の中の名前(英数字)
#   label   表示名。<br/> で改行
#   code    "ファイル::シンボル"。archmap が定義の行を探してリンクにする。見つからなければ CI が落ちる
#   doc     設計書・ADR へのリンク(ファイルの存在を確かめる)
#   ticket  T-xxxx(docs/tickets/ にあるか確かめる)
#   status  done(実装済み・code 必須)/ planned / research / external(OS・ドライバ)
#   group   views[].groups の id(枠で囲む)
#   note    表に出す短いメモ
# 辺: [from, to, "ラベル"] または [from, to, "ラベル", async](点線 = 非同期・次フレーム以降)
#
# 関数を移したり名前を変えたりしたら、ここも直す(CI の archmap --check が教えてくれる)。
# 計画中のノードが実装されたら status を外して code を書く。
title: Bicameral Engine — architecture map
repo: Petaf000/BicameralEngine

views:
  # ---------------------------------------------------------------------------------------------
  - id: now
    title: 今動いているもの
    description: >-
      起動して GPU の対応状況(SM 6.8 / DXR / Mesh / Work Graphs)を調べるところまで(T-0001)。
      Agility SDK は exe が 2 つの値をエクスポートすることで、OS の d3d12.dll に読み込ませる。
    direction: TD
    groups:
      - { id: exe, label: "bicameral.exe" }
      - { id: corelib, label: "core(どこからでも使う部品)" }
      - { id: os, label: "OS / ドライバ" }
    nodes:
      - { id: main, group: exe, label: "wmain()<br/>コマンドラインの振り分け", code: "engine/src/main.cpp::wmain" }
      - { id: caps, group: exe, label: "RunCapsProbe()<br/>アダプタを列挙して機能を問い合わせる",
          code: "engine/src/platform/caps.cpp::RunCapsProbe", ticket: T-0001 }
      - { id: runtime, group: exe, label: "ReportRuntime()<br/>どの D3D12Core.dll が読まれたか",
          code: "engine/src/platform/caps.cpp::ReportRuntime" }
      - { id: device, group: exe, label: "ReportDevice()<br/>SM / DXR / Mesh / Work Graphs の tier",
          code: "engine/src/platform/caps.cpp::ReportDevice" }
      - { id: sdkver, group: exe, label: "D3D12SDKVersion / D3D12SDKPath<br/>Agility SDK のエクスポート",
          code: "engine/src/platform/agility_sdk.cpp::D3D12SDKVersion",
          note: "ADR-0004。D3D12Core.dll は CMake が bin/D3D12 にコピーする" }
      - { id: log, group: corelib, label: "Log() / Logger(シングルトン)<br/>サブシステム名・重大度つきのログ",
          code: "engine/src/core/log.h::Log", ticket: T-0007, doc: docs/design/03-logging.md }
      - { id: checkhr, group: corelib, label: "BICAMERAL_CHECK_HR<br/>HRESULT の失敗を式・場所つきで",
          code: "engine/src/core/hresult.cpp::CheckHresult", doc: docs/decisions/ADR-0006-logging.md }
      - { id: sinks, group: corelib, label: "出力先<br/>コンソール / VS 出力 / logs/*.log",
          code: "engine/src/core/log_sinks.cpp::OpenLogFile", note: "ログは exe の横の logs/(ADR-0006)" }
      - { id: d3d12, group: os, status: external, label: "d3d12.dll(OS)",
          doc: docs/decisions/ADR-0004-agility-sdk-and-dxc.md }
      - { id: core, group: os, status: external, label: "D3D12Core.dll<br/>Agility SDK 1.619",
          doc: docs/decisions/ADR-0004-agility-sdk-and-dxc.md }
    edges:
      - [main, caps, "--caps"]
      - [caps, d3d12, "D3D12CreateDevice"]
      - [d3d12, sdkver, "起動時に読む"]
      - [d3d12, core, "bin/D3D12 から読み込む"]
      - [caps, device, "アダプタごと"]
      - [caps, runtime, "デバイス作成後"]
      - [main, sinks, "ログファイルを開く"]
      - [caps, checkhr, "失敗しうる API"]
      - [caps, log, "結果"]
      - [checkhr, log, "Error"]
      - [log, sinks]

  # ---------------------------------------------------------------------------------------------
  - id: frame
    title: 1 フレームの流れ(計画)
    description: >-
      CPU は入力を渡してコマンドリストを投げ、Present するだけ。世界の状態は VRAM に常駐し、
      反応の連鎖は Work Graphs が実行時に決まる深さまで走り切る。GPU → CPU はブロックしないリングバッファ。
    direction: TD
    groups:
      - { id: cpu, label: "CPU(薄い)" }
      - { id: gpu, label: "GPU(世界の真実)" }
    nodes:
      - { id: input, group: cpu, status: planned, label: "入力を GPU へ", ticket: T-0004 }
      - { id: submit, group: cpu, status: planned, label: "事前記録のコマンドリストを投入", ticket: T-0004 }
      - { id: present, group: cpu, status: planned, label: "Present", ticket: T-0004 }
      - { id: audio, group: cpu, status: planned, label: "音の出力<br/>(見込み発音 → GPU の結果で確定)",
          doc: docs/design/01-architecture.md }
      - { id: hash, group: gpu, status: planned, label: "空間ハッシュ・近傍検索<br/>Compute",
          doc: docs/design/01-architecture.md }
      - { id: active, group: gpu, status: planned, label: "活性ノード選別<br/>Work Graphs",
          doc: docs/design/01-architecture.md }
      - { id: react, group: gpu, status: planned, label: "反応の連鎖(世代同期)<br/>Work Graphs",
          doc: docs/design/02-reaction-system.md, ticket: T-0005,
          note: "決定性は ADR-0003(提案中)" }
      - { id: field, group: gpu, status: planned, label: "見た目の場(炎・煙・空気)<br/>Work Graphs でセルを Spawn/Destroy",
          doc: docs/design/01-architecture.md }
      - { id: contact, group: gpu, status: planned, label: "AVBD 接触生成<br/>Work Graphs",
          doc: docs/decisions/ADR-0002-avbd-execution.md }
      - { id: solve, group: gpu, status: planned, label: "AVBD ソルバー(色 × 反復)<br/>Compute",
          doc: docs/decisions/ADR-0002-avbd-execution.md, note: "ADR-0002(提案中)" }
      - { id: draw, group: gpu, status: planned, label: "Visibility Buffer 描画", doc: docs/design/01-architecture.md }
      - { id: sound, group: gpu, status: planned, label: "音の種類を決める<br/>(反応の出力)", doc: docs/design/01-architecture.md }
      - { id: ring, group: gpu, status: planned, label: "GPU → CPU リングバッファ<br/>音イベント・UI・デバッグ出力",
          ticket: T-0003 }
    edges:
      - [input, submit]
      - [submit, hash]
      - [hash, active]
      - [active, react]
      - [react, field]
      - [react, contact, "破壊・変形"]
      - [contact, solve]
      - [field, draw]
      - [solve, draw]
      - [react, sound]
      - [sound, ring]
      - [draw, present]
      - [ring, audio, "", async]

  # ---------------------------------------------------------------------------------------------
  - id: data
    title: データの流れ(計画)
    description: >-
      反応則はエディタ(CPU)で書き、GPU 用のバイナリにベイクする。ランタイムは起動時に VRAM へ載せたら、
      以後 CPU には戻さない。魔法は Circuit Table へのパッチ。
    direction: LR
    groups:
      - { id: tool, label: "エディタ・ツール(CPU を好きなだけ使う)" }
      - { id: rt, label: "ランタイム" }
    nodes:
      - { id: rules, group: tool, status: planned, label: "反応則を書く<br/>(Luau)", doc: docs/design/02-reaction-system.md }
      - { id: bake, group: tool, status: planned, label: "ベイク", doc: docs/design/01-architecture.md }
      - { id: table, group: rt, status: planned, label: "Circuit Table / 世界データ<br/>(バイナリ)", ticket: T-0002 }
      - { id: dstorage, group: rt, status: planned, label: "DirectStorage で VRAM へ", doc: docs/design/01-architecture.md }
      - { id: vram, group: rt, status: planned, label: "VRAM 常駐の世界", doc: docs/decisions/ADR-0001-gpu-resident-runtime.md }
      - { id: magic, group: rt, status: planned, label: "魔法<br/>= 反応則へのパッチ", doc: docs/design/02-reaction-system.md }
    edges:
      - [rules, bake]
      - [bake, table]
      - [table, dstorage]
      - [dstorage, vram]
      - [magic, vram, "触媒・阻害・転換・増幅"]
