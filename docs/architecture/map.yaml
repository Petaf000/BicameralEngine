# アーキテクチャ図の定義(T-0006 案 C)。tools/archmap/archmap.py がこれを読んでページを作る。
#
# ノード:
#   id      図の中の名前(英数字)
#   label   表示名。<br/> で改行
#   code    "ファイル::シンボル"。archmap が定義の行を探してリンクにする。見つからなければ CI が落ちる
#   doc     設計書・ADR へのリンク(ファイルの存在を確かめる)
#   ticket  T-xxxx(docs/tickets/ にあるか確かめる)
#   status  done(実装済み・code 必須)/ planned / research / external(OS・ドライバ)
#   group   views[].groups の id(枠で囲む)
#   note    表に出す短いメモ
# 辺: [from, to, "ラベル"] または [from, to, "ラベル", async](点線 = 非同期・次フレーム以降)
#
# 関数を移したり名前を変えたりしたら、ここも直す(CI の archmap --check が教えてくれる)。
# 計画中のノードが実装されたら status を外して code を書く。
title: Bicameral Engine — architecture map
repo: Petaf000/BicameralEngine

views:
  # ---------------------------------------------------------------------------------------------
  - id: now
    title: 今動いているもの
    description: >-
      起動して GPU の対応状況(SM 6.8 / DXR / Mesh / Work Graphs)を調べるところまで(T-0001)と、
      シミュの整数の数学ライブラリ(T-0010。GPU と CPU が同じソースで計算する)と、
      シミュに浮動小数点が入ったらビルドを落とす検査(T-0011)と、
      GPU の小さな道具(デバイス・1 回投げて待つキュー・Work Graph)で自己テストと最小のグラフを GPU / WARP で走らせるテスト(T-0013)と、
      シェーダーの printf / assert のリング・debug layer / GBV / DRED(T-0003)と、
      窓とフレームのループ(T-0004): compute キューの仮の刻みと direct キューの描画をフェンスだけで並べ、
      記録済みのリストを使い回し、GPU → CPU は待たない読み戻し、刻みの数はタイムスタンプで決める。
      Agility SDK は exe が 2 つの値をエクスポートすることで、OS の d3d12.dll に読み込ませる。
    direction: TD
    groups:
      - { id: exe, label: "bicameral.exe" }
      - { id: framelib, label: "フレームのループ(T-0004)" }
      - { id: simlib, label: "sim(仮の刻み。本物は T-0012)" }
      - { id: corelib, label: "core(どこからでも使う部品)" }
      - { id: gpulib, label: "gpu(D3D12 の小さな道具)" }
      - { id: shared, label: "shaders/common(HLSL と C++ で共通)" }
      - { id: tests, label: "テスト(ctest)" }
      - { id: build, label: "ビルドの中の検査(CMake + Python)" }
      - { id: os, label: "OS / ドライバ" }
    nodes:
      - { id: main, group: exe, label: "wmain()<br/>コマンドラインの振り分け", code: "engine/src/main.cpp::wmain" }
      - { id: frameloop, group: framelib, label: "RunFrameLoop()<br/>待ち → 読み戻し → 入力 → シミュ → 描画 → Present",
          code: "engine/src/frame/frame_loop.cpp::RunFrameLoop", ticket: T-0004, doc: docs/design/06-simulation-loop.md,
          note: "抽出は 3 組。描画は終わっている最新を読み、シミュを待たない。バッチは 2 つまで重ねる" }
      - { id: window, group: framelib, label: "Window<br/>Win32 の窓・クリック・DPI",
          code: "engine/src/platform/window.cpp::Window::Create", ticket: T-0004 }
      - { id: pacer, group: framelib, label: "TickPacer<br/>1 フレームの刻みの数(経過時間・GPU の時間)",
          code: "engine/src/frame/tick_pacer.cpp::TickPacer::TakeTicks", ticket: T-0004,
          note: "追いつけない分は捨てる → 世界が遅くなる(D-202)。tick_pacer_test" }
      - { id: probeview, group: framelib, label: "ProbeView<br/>画面いっぱいの三角形で抽出を描く",
          code: "engine/src/render/probe_view.cpp::ProbeView::Record", ticket: T-0004 }
      - { id: queue, group: gpulib, label: "Queue<br/>キュー + フェンス(Submit・GpuWait・待たずに見る)",
          code: "engine/src/gpu/queue.cpp::Queue::Submit", ticket: T-0004 }
      - { id: swapchain, group: gpulib, label: "SwapChain<br/>フリップ・3 枚・待てる(先行 2〜3)",
          code: "engine/src/gpu/swap_chain.cpp::SwapChain::Create", ticket: T-0004 }
      - { id: readbackring, group: gpulib, label: "ReadbackRing<br/>追記バッファを枠ごとの読み戻しへ(待たない)",
          code: "engine/src/gpu/readback_ring.cpp::ReadbackRing::RecordReadbackAndReset", ticket: T-0004,
          doc: docs/design/06-simulation-loop.md }
      - { id: probesim, group: simlib, label: "ProbeSim<br/>刻みの数ごとに記録したバッチのリスト",
          code: "engine/src/sim/probe_sim.cpp::ProbeSim::PrepareBatch", ticket: T-0004,
          note: "コマンド(64 バイト)→ つつき → 拡散 → 抽出。イベントとタイムスタンプを読み戻す" }
      - { id: probetick, group: simlib, label: "probe_tick.hlsl<br/>ApplyCommands / Diffuse / Extract",
          code: "shaders/sim/probe_tick.hlsl::GenerationBase", ticket: T-0004 }
      - { id: probereference, group: simlib, label: "ProbeReference<br/>CPU リファレンス(probe_sim.hlsli を共有)",
          code: "engine/src/sim/probe_sim.cpp::ProbeReference::Advance", ticket: T-0004 }
      - { id: probesimtest, group: tests, label: "gpu_probe_sim_test<br/>分け方を変えても CPU とビット一致",
          code: "tests/gpu_probe_sim_test.cpp::RunSplit", ticket: T-0004,
          note: "8 ずつ / 1 ずつ / ばらばら × ハードウェア / WARP。イベントの数と場所も" }
      - { id: caps, group: exe, label: "RunCapsProbe()<br/>アダプタを列挙して機能を問い合わせる",
          code: "engine/src/platform/caps.cpp::RunCapsProbe", ticket: T-0001 }
      - { id: runtime, group: exe, label: "ReportRuntime()<br/>どの D3D12Core.dll が読まれたか",
          code: "engine/src/platform/caps.cpp::ReportRuntime" }
      - { id: device, group: exe, label: "ReportDevice()<br/>SM / DXR / Mesh / Work Graphs の tier",
          code: "engine/src/platform/caps.cpp::ReportDevice" }
      - { id: sdkver, group: exe, label: "D3D12SDKVersion / D3D12SDKPath<br/>Agility SDK のエクスポート",
          code: "engine/src/platform/agility_sdk.cpp::D3D12SDKVersion",
          note: "ADR-0004。D3D12Core.dll は CMake が bin/D3D12 にコピーする" }
      - { id: log, group: corelib, label: "Log() / Logger(シングルトン)<br/>サブシステム名・重大度つきのログ",
          code: "engine/src/core/log.h::Log", ticket: T-0007, doc: docs/design/03-logging.md }
      - { id: checkhr, group: corelib, label: "BICAMERAL_CHECK_HR<br/>HRESULT の失敗を式・場所つきで",
          code: "engine/src/core/hresult.cpp::CheckHresult", doc: docs/decisions/ADR-0006-logging.md }
      - { id: sinks, group: corelib, label: "出力先<br/>コンソール / VS 出力 / logs/*.log",
          code: "engine/src/core/log_sinks.cpp::OpenLogFile", note: "ログは exe の横の logs/(ADR-0006)" }
      - { id: fixed, group: shared, label: "整数の数学ライブラリ(fixed.hlsli)<br/>128bit 積・割り算・平方根・log/exp・sin/cos・乱数",
          code: "shaders/common/fixed.hlsli::FxMulU64Full", ticket: T-0010, doc: docs/design/04-numerics-determinism.md,
          note: "1 つのソースを HLSL と C++ で使う(D-307)" }
      - { id: selftest, group: shared, label: "自己テスト(fixed_selftest)<br/>CPU と GPU が同じ列を計算",
          code: "shaders/common/fixed_selftest.hlsli::FxSelfTestCase", ticket: T-0010,
          note: "ビルドで DXC が通す。GPU で走らせて比べるのは T-0013" }
      - { id: fixedtest, group: tests, label: "fixed_test<br/>128bit 組み込み関数とのビット一致・誤差の測定",
          code: "tests/fixed_test.cpp::TestSelfTestDigest", ticket: T-0010 }
      - { id: gpudevice, group: gpulib, label: "Device::Create()<br/>ハードウェアの GPU か WARP・debug layer / GBV / DRED",
          code: "engine/src/gpu/device.cpp::Device::Create", ticket: T-0003, doc: docs/design/16-debug-test.md,
          note: "debug プリセットで検証を有効化。debug layer の報告はログへ流して数える(テストは 0 件を確かめる)" }
      - { id: dred, group: gpulib, label: "LogDeviceRemoved()<br/>デバイス喪失の理由・DRED のブレッドクラムとページフォールト",
          code: "engine/src/gpu/device.cpp::LogDeviceRemoved", ticket: T-0003 }
      - { id: debugring, group: gpulib, label: "DebugRing<br/>シェーダーの printf / assert を読み戻してログへ",
          code: "engine/src/gpu/debug_ring.cpp::DebugRing::Drain", ticket: T-0003, doc: docs/design/16-debug-test.md,
          note: "書式の番号 + 整数の引数だけを GPU が書き、文字列は CPU が持つ(debug_formats.hlsli)" }
      - { id: debugringhlsl, group: shared, label: "debug_ring.hlsli<br/>DEBUG_PRINT / DEBUG_ASSERT(ノードからも)",
          code: "shaders/common/debug_ring.hlsli::DebugFormat", ticket: T-0003,
          note: "u0 space1。Debug のシミュのシェーダーだけ有効(FX_ASSERT もここへ)" }
      - { id: immediate, group: gpulib, label: "ImmediateQueue<br/>1 本記録して投げて待つ(direct / compute)",
          code: "engine/src/gpu/immediate_queue.cpp::ImmediateQueue::ExecuteAndWait", ticket: T-0013,
          note: "テストと準備用。フレームのループは待たない別の仕組み(T-0012)" }
      - { id: workgraph, group: gpulib, label: "WorkGraph<br/>状態オブジェクト・裏のメモリ・DispatchGraph",
          code: "engine/src/gpu/work_graph.cpp::WorkGraph::Create", ticket: T-0013 }
      - { id: gpufixedtest, group: tests, label: "gpu_fixed_test<br/>自己テストを GPU で走らせ CPU と 1 値ずつ比べる",
          code: "tests/gpu_fixed_test.cpp::CompareWithCpu", ticket: T-0013,
          note: "ハードウェアと WARP、debug(-Od)と release で一致" }
      - { id: fixedbench, group: tests, label: "gpu_fixed_bench<br/>整数のルーチンの費用(タイムスタンプ)",
          code: "tests/gpu_fixed_bench.cpp::Measure", ticket: T-0010, doc: docs/design/04-numerics-determinism.md,
          note: "ctest に入れない計測。shaders/bench を演算ごとにコンパイル。DXIL の命令数は tools/fixed_bench/dxil_count.py" }
      - { id: wgtest, group: tests, label: "gpu_work_graph_test<br/>Root → Leaf の最小のグラフ",
          code: "tests/gpu_work_graph_test.cpp::RunGraph", ticket: T-0013,
          note: "direct / compute キュー × ハードウェア / WARP。64bit atomic" }
      - { id: ringtest, group: tests, label: "gpu_debug_ring_test / gpu_debug_device_test<br/>リング・debug layer・DRED",
          code: "tests/gpu_debug_ring_test.cpp::RunGpuTests", ticket: T-0003,
          note: "compute とノードからの print、溢れ、空に戻るか。わざと誤った呼び出しとデバイスの喪失" }
      - { id: d3d12, group: os, status: external, label: "d3d12.dll(OS)",
          doc: docs/decisions/ADR-0004-agility-sdk-and-dxc.md }
      - { id: core, group: os, status: external, label: "D3D12Core.dll<br/>Agility SDK 1.619",
          doc: docs/decisions/ADR-0004-agility-sdk-and-dxc.md }
      - { id: addshader, group: build, label: "bicameral_add_shader()<br/>DXC で sim / render を分けてコンパイル",
          code: "shaders/CMakeLists.txt::bicameral_add_shader", ticket: T-0011, doc: docs/design/04-numerics-determinism.md,
          note: "成果物は bin/shaders/sim|render/*.cso" }
      - { id: dxilcheck, group: build, label: "dxil_float_check<br/>シミュの DXIL に浮動小数点があれば落とす",
          code: "tools/float_check/dxil_float_check.py::FindViolations", ticket: T-0011,
          note: "型(float など)と命令(fadd・sitofp など)。asfloat の抜け道も捕まる" }
      - { id: srccheck, group: build, label: "source_float_check<br/>共通のヘッダ・CPU リファレンスの float / double",
          code: "tools/float_check/source_float_check.py::FindViolations", ticket: T-0011,
          note: "型・小数のリテラル・<cmath> の関数。HLSL と C++ を同じ規則で" }
    edges:
      - [main, caps, "--caps"]
      - [caps, d3d12, "D3D12CreateDevice"]
      - [d3d12, sdkver, "起動時に読む"]
      - [d3d12, core, "bin/D3D12 から読み込む"]
      - [caps, device, "アダプタごと"]
      - [caps, runtime, "デバイス作成後"]
      - [main, sinks, "ログファイルを開く"]
      - [caps, checkhr, "失敗しうる API"]
      - [caps, log, "結果"]
      - [checkhr, log, "Error"]
      - [log, sinks]
      - [selftest, fixed]
      - [fixedtest, selftest, "CPU で要約を作る"]
      - [fixedtest, fixed]
      - [addshader, selftest, "DXC(cs_6_8)"]
      - [addshader, dxilcheck, "sim は逆アセンブルを検査"]
      - [srccheck, fixed, "トークンを検査"]
      - [gpufixedtest, gpudevice]
      - [gpufixedtest, immediate, "compute キュー"]
      - [gpufixedtest, selftest, "GPU(.cso)と CPU で同じ列"]
      - [fixedbench, fixed, "演算ごとの .cso(shaders/bench)"]
      - [fixedbench, immediate, "タイムスタンプ"]
      - [addshader, fixedbench, "DEFINES で変種"]
      - [wgtest, workgraph]
      - [wgtest, immediate, "direct / compute"]
      - [gpudevice, d3d12]
      - [gpudevice, log, "debug layer の報告"]
      - [immediate, dred, "デバイスが失われたら"]
      - [fixed, debugringhlsl, "FX_ASSERT"]
      - [debugringhlsl, debugring, "読み戻し(フレームの終わり)"]
      - [debugring, log, "Channel::Gpu / WorkGraph"]
      - [ringtest, debugring]
      - [ringtest, workgraph, "ノードから print"]
      - [main, frameloop, "引数なし"]
      - [frameloop, window, "クリック"]
      - [frameloop, pacer, "刻みの数"]
      - [frameloop, probesim, "バッチ(compute キュー)"]
      - [frameloop, probeview, "記録済みのリスト(direct キュー)"]
      - [frameloop, queue, "Submit・GpuWait"]
      - [frameloop, swapchain, "WaitForFrame・Present"]
      - [probesim, probetick, ".cso"]
      - [probesim, readbackring, "イベント"]
      - [probesim, debugring, "枠ごとの読み戻し"]
      - [debugring, readbackring]
      - [probesimtest, probesim]
      - [probesimtest, probereference, "要約を比べる"]
      - [readbackring, frameloop, "数フレーム後に読む", async]

  # ---------------------------------------------------------------------------------------------
  - id: frame
    title: 1 刻みとフレーム(計画)
    description: >-
      世界の状態と因果はすべて GPU(D-107)。CPU は入力をコマンドにして積み、Present するだけ。
      シミュは compute キュー、描画は direct キューで並べて走らせ、同期は GPU のフェンスだけ。
      1 刻み = 世界時間 1/60 秒。重いと世界の時間が遅くなるが、結果は変わらない(D-202・D-409)。
    direction: TD
    groups:
      - { id: cpu, label: "CPU(View と Controller)" }
      - { id: sim, label: "GPU の 1 刻み(compute キュー。docs/design/06 §2 の段)" }
      - { id: view, label: "GPU の描画(direct キュー)" }
    nodes:
      - { id: input, group: cpu, label: "入力 → コマンド<br/>(適用する刻みつき)", ticket: T-0004,
          code: "engine/src/frame/frame_loop.cpp::FrameLoop::QueueClicks", doc: docs/design/06-simulation-loop.md }
      - { id: present, group: cpu, label: "Present", ticket: T-0004,
          code: "engine/src/frame/frame_loop.cpp::FrameLoop::RunFrame" }
      - { id: audio, group: cpu, status: planned, label: "音・UI<br/>(リングを 1〜3 フレーム遅れで読む)",
          doc: docs/design/11-audio.md }
      - { id: command, group: sim, status: planned, label: "1 コマンド適用<br/>Compute", doc: docs/design/06-simulation-loop.md }
      - { id: active, group: sim, status: planned, label: "2 活性の整理<br/>Work Graphs", doc: docs/design/05-world-data.md }
      - { id: transport, group: sim, status: planned, label: "3 輸送(熱・気体・水・魔素)<br/>測って安い方(D-302)",
          ticket: T-0005, doc: docs/design/07-transport.md, note: "M1 はクリックした点から熱が伝わるだけ" }
      - { id: react, group: sim, status: planned, label: "4 反応<br/>Work Graphs", doc: docs/design/02-reaction-system.md }
      - { id: physics, group: sim, status: research, label: "5 物理(整数の AVBD)<br/>接触生成 → ソルバー",
          doc: docs/design/08-bodies-physics.md, note: "研究 R-PHYS" }
      - { id: creatures, group: sim, status: planned, label: "6 生き物", doc: docs/design/09-creatures-animation.md }
      - { id: couple, group: sim, status: planned, label: "7 結合(物 ↔ 場)", doc: docs/design/08-bodies-physics.md }
      - { id: coarse, group: sim, status: planned, label: "8 粗い層(60 刻みに 1 回)", doc: docs/design/05-world-data.md }
      - { id: check, group: sim, status: planned, label: "9 検査と出力<br/>保存則・状態のハッシュ・リング",
          doc: docs/design/16-debug-test.md }
      - { id: ring, group: sim, label: "GPU → CPU の待たないリング<br/>イベント・スナップショット・デバッグ",
          ticket: T-0004, code: "engine/src/gpu/readback_ring.cpp::ReadbackRing::RecordReadbackAndReset" }
      - { id: extract, group: view, status: planned, label: "描画用の抽出(3 組)", doc: docs/design/10-rendering.md,
          note: "T-0004 の仮の世界では 3 組で描画がシミュを待たないことを確かめた" }
      - { id: draw, group: view, status: planned, label: "Visibility Buffer・PBR・ReSTIR", doc: docs/design/10-rendering.md }
      - { id: math, group: sim, label: "整数の数学ライブラリ<br/>(全部の段が使う)", code: "shaders/common/fixed.hlsli::FxMulU64Full",
          ticket: T-0010 }
    edges:
      - [input, command, "コマンドキュー"]
      - [command, active]
      - [active, transport]
      - [transport, react]
      - [react, physics]
      - [physics, creatures]
      - [creatures, couple]
      - [couple, coarse]
      - [coarse, check]
      - [check, ring]
      - [check, extract]
      - [extract, draw]
      - [draw, present]
      - [ring, audio, "", async]
      - [react, math]

  # ---------------------------------------------------------------------------------------------
  - id: data
    title: データの流れ(計画)
    description: >-
      ゲームを作る人が触るものは全部 Luau(D-318)。エディタが整数の表にベイクし(保存則を検査)、GPU に載せる。
      世界は決定的な生成 + 差分(D-312)。魔法は刻みの境界で適用される表へのパッチ(コマンド)。
    direction: LR
    groups:
      - { id: tool, label: "エディタ・ツール(CPU を好きなだけ使う)" }
      - { id: rt, label: "ランタイム(GPU)" }
    nodes:
      - { id: luau, group: tool, status: planned, label: "反応則・生き物・進行を書く<br/>(Luau)",
          doc: docs/design/13-scripting-game-model.md }
      - { id: bake, group: tool, status: planned, label: "ベイク(整数)<br/>元素とエネルギーの釣り合いを検査",
          doc: docs/design/02-reaction-system.md, note: "ベイクも fixed.hlsli で計算する(R7)" }
      - { id: table, group: rt, status: planned, label: "反応表・物質の表<br/>(版つきのバイナリ)", ticket: T-0002 }
      - { id: gen, group: rt, status: planned, label: "決定的な生成(シード)+ 差分", doc: docs/design/05-world-data.md }
      - { id: vram, group: rt, status: planned, label: "多重解像度の疎な木<br/>(VRAM 常駐の世界)",
          doc: docs/design/17-multiresolution.md }
      - { id: magic, group: rt, status: planned, label: "魔法<br/>= 表へのパッチ + 魔素を使う放出", doc: docs/design/02-reaction-system.md }
      - { id: save, group: tool, status: planned, label: "セーブ・再生ファイル<br/>(差分 + コマンドの列)",
          doc: docs/design/15-save-replay-mods.md }
    edges:
      - [luau, bake]
      - [bake, table]
      - [table, vram]
      - [gen, vram]
      - [magic, vram, "触媒・阻害・転換・増幅"]
      - [vram, save, "差分"]
