          note: "Compute の段 shaders/sim/implicit_conduct.hlsl(1 スレッド = 1 節。隣が多い節は 1 グループで足し、小さい段から下は ImTail の 1 Dispatch〔T-0120〕)。止めるかは GPU の状態の語で決め、止めた後の段は述語で飛ばす。大きさは上限から、段の形・ImTail の境・Dispatch の大きさは刻みの初めに GPU が作る計画(ImPlanLevels・ImPlanArgs)から読み、ExecuteIndirect で積む〔T-0136〕" }
      - { id: gpuimplicitbuild, group: simlib, label: "GpuImplicitBuild::RecordBuild<br/>陰解法の系(未知数・境のセル・面)を GPU の木から作る",
