  # ---------------------------------------------------------------------------------------------
  - id: data
    title: データの流れ(計画)
    description: >-
      ゲームを作る人が触るものは全部 Luau(D-318)。エディタが整数の表にベイクし(保存則を検査)、GPU に載せる。
      世界は決定的な生成 + 差分(D-312)。魔法は刻みの境界で適用される表へのパッチ(コマンド)。
    direction: LR
    groups:
      - { id: tool, label: "エディタ・ツール(CPU を好きなだけ使う)" }
      - { id: rt, label: "ランタイム(GPU)" }
    nodes:
      - { id: luau, group: tool, label: "反応則・生き物・進行を書く<br/>(Luau の殻)",
          code: "engine/src/script/luau_sandbox.cpp::LuauSandbox::Run", ticket: T-0020, doc: docs/design/13-scripting-game-model.md,
          note: "許したものだけ見せる殻・安全点とメモリの上限・実行ごとに種を戻す(ADR-0030。luau_sandbox_test)。ホットリロードは T-0139" }
      - { id: packages, group: tool, label: "パッケージ<br/>(1 フォルダ = 1 つ・依存の順・表を合わせる)",
          code: "engine/src/script/luau_package.cpp::LoadPackages", ticket: T-0138, doc: docs/design/13-scripting-game-model.md,
          note: "require はパッケージの中だけ。合わせ方は追加だけ / 印つきの上書き / 上書き(Q8 未回答・仮で C)。表の版 = 中身のハッシュ(ADR-0031。luau_package_test)" }
      - { id: typecheck, group: tool, label: "読む前の型検査<br/>(Luau.Analysis・型の定義)",
          code: "engine/src/script/luau_type_check.cpp::LuauTypeChecker::CheckPackage", ticket: T-0140,
          doc: docs/design/13-scripting-game-model.md,
          note: "data/types/bicameral.d.luau の型で、全部のファイルを strict で検査し、返す表は欄ごとに突き合わせる。誤りは「ファイル:行:列: 何が違うか」。誤りのあるパッケージは読まない(ADR-0046。luau_type_check_test)" }
      - { id: rxread, group: tool, label: "反応表を読む<br/>(elements・species・reactions → 定義)",
          code: "engine/src/script/reaction_package.cpp::ReadReactionTableDefinition", ticket: T-0021,
          doc: docs/design/02-reaction-system.md,
          note: "値は整数だけ・単位は欄の名前・A は 10 進の文字列でも・知らない欄は誤り(ADR-0032)。試験の表は data/packages/combustion_test(reaction_package_test)" }
      - { id: bake, group: tool, label: "ベイク(整数)<br/>元素とエネルギーの釣り合いを検査",
          code: "engine/src/sim/reaction_table.cpp::BakeReactionTable", ticket: T-0021,
          doc: docs/design/02-reaction-system.md, note: "ベイクも fixed.hlsli で計算する(R7)。名前のバイト順で ID を振る(並びに依らない。ADR-0032)。文献の反応熱の食い違いは警告。C++ の試験の表と Luau の試験の表がビットで同じ" }
      - { id: rtload, group: rt, label: "起動時に表を読む<br/>(exe の横の data/packages → ベイク → GPU)",
          code: "engine/src/script/reaction_table_loader.cpp::LoadReactionTable", ticket: T-0157,
          doc: docs/design/02-reaction-system.md,
          note: "ゲーム本体・エディタ・テストの入り口(ADR-0033)。読めない・検査で落ちたら窓を開く前に止まる。今の場面は C++ の表と毎刻みビットで同じ(reaction_package_scene)" }
      - { id: table, group: rt, status: planned, label: "反応表・物質の表<br/>(版つきのバイナリ)", ticket: T-0002 }
      - { id: gen, group: rt, status: planned, label: "決定的な生成(シード)+ 差分", doc: docs/design/05-world-data.md }
      - { id: vram, group: rt, status: planned, label: "多重解像度の疎な木<br/>(VRAM 常駐の世界)",
          doc: docs/design/17-multiresolution.md }
      - { id: magic, group: rt, status: planned, label: "魔法<br/>= 表へのパッチ + 魔素を使う放出", doc: docs/design/02-reaction-system.md }
      - { id: save, group: tool, label: "セーブ・再生ファイル<br/>(差分 + コマンドの列)",
          code: "engine/src/save/replay_file.cpp::SerializeReplay", ticket: T-0086, doc: docs/design/15-save-replay-mods.md,
          note: "再生ファイルの骨組みは T-0086(仮の世界)。セーブ(差分の書き出し)は後" }
    edges:
      - [luau, packages]
      - [packages, typecheck, "読む前に"]
      - [packages, rxread, "分類 → 鍵 → 値"]
      - [rxread, bake, "定義"]
      - [bake, table]
      - [rtload, packages, "起動時"]
      - [rtload, vram, "表を GPU へ"]
      - [table, vram]
      - [gen, vram]
      - [magic, vram, "触媒・阻害・転換・増幅"]
      - [vram, save, "差分"]
