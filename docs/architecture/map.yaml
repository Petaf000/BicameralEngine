          note: "Compute の段 shaders/sim/implicit_build.hlsl(GpuMultires のルート署名 + 外のバッファ)。番号は CPU の MakeSystem と同じ(接頭和と atomic の最小)。多重格子の段・重みは GpuImplicitLevels(T-0134)" }
