          note: "Arrhenius を温度 1 K ごとの表に(整数の ln・exp。R7)。試験の表は reaction_test_table(物質 7・規則 5)" }
      - { id: reactiontest, group: tests, label: "reaction_test<br/>ベイクの検査・保存則・取り合い・並び・遅い反応",
          code: "tests/reaction_test.cpp::TestClosedCellBurn", ticket: T-0014 }
      - { id: gpureactiontest, group: tests, label: "gpu_reaction_test<br/>セル 4096 × 400 刻みを GPU と CPU で比べる",
          code: "tests/gpu_reaction_test.cpp::CompareSegment", ticket: T-0014,
