      - { id: multireshlsl, group: shared, label: "multires.hlsli<br/>細かくする・粗くする(端数)・影の引き戻し",
          code: "shaders/common/multires.hlsli::MrCoarsenCell", ticket: T-0017, doc: docs/decisions/ADR-0015-multiresolution-tree-and-fraction.md,
          note: "比 2 のブロック(8³、子は親の 1/8)。単位はレベルごとに 1/8。粗くした余りは 64bit の端数(21 段の往復までビット一致)" }
      - { id: multiresnest, group: simlib, label: "MultiresNest<br/>入れ子の細分の CPU リファレンス",
