# CI(T-0006, ADR-0005)
#   build : Windows でビルド(debug / release)+ ctest。GPU の無い機械なので、ハードウェアの GPU が要るテスト(ラベル gpu)は外し、
#           WARP(ソフトウェアの D3D12)で走る GPU のテスト(ラベル warp)は回す(T-0013)。
#           ビルドの中でシミュの浮動小数点の検査(tools/float_check)が走る。debug では clang-tidy も(tools/tidy)
#   docs  : 整形の検査(clang-format)・アーキテクチャ図のリンク切れ検査(archmap --check)→ 図のページ + Doxygen を作る
#   deploy: main への push のときだけ、docs の成果物を GitHub Pages に出す
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7

      # --- ツール: cmake + ninja、MSVC の環境変数 -------------------------------------------------
      - uses: lukka/get-cmake@latest
      # ビルドの中の検査(tools/float_check)と clang-tidy の実行に使う
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # MSVC の環境変数(INCLUDE・LIB・PATH など)を以降のステップに渡す。
      # ilammy/msvc-dev-cmd は Node 20 のまま更新が止まっているので、vswhere + vcvars64.bat で同じことをする(T-0011)
      - name: MSVC developer environment (x64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      # --- vcpkg: vcpkg.json の builtin-baseline と同じ版を使う(ADR-0004)---------------------------
      - name: Set up vcpkg at builtin-baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet https://github.com/microsoft/vcpkg $root
          git -C $root checkout --quiet $baseline
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      # CMakePresets.json がバイナリキャッシュとダウンロードを out/vcpkg に置くので、そこを保存する
      - uses: actions/cache@v6
        with:
          path: |
            out/vcpkg/archives
            out/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # --- ビルドとテスト ---------------------------------------------------------------------------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --label-exclude gpu

      # .clang-tidy の規則(docs/style.md)。PC では job.py tidy(VS 同梱の clang-tidy 22)で同じことをする
      - name: clang-tidy
        if: matrix.preset == 'debug'
        run: |
          python -m pip install clang-tidy==22.1.8
          python tools/tidy/run_clang_tidy.py --build-dir out/build/debug

  docs:
    name: Architecture map & API docs
    # ubuntu-latest は 2026-10-19〜11-19 に 26.04 へ移る。移る日に突然変わらないよう、版を固定する(T-0011)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml clang-format==23.1.1

      # 整形のずれ(.clang-format、docs/style.md)。直し方: clang-format -i <ファイル>
      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' '*.hpp' '*.hlsl' '*.hlsli' | xargs --no-run-if-empty clang-format --dry-run --Werror

      # 図のノードが指す関数が消えたり改名されたりしていたら、ここで落ちる
      - name: Check architecture map links
        run: python tools/archmap/archmap.py --check

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update -q && sudo apt-get install -y -q doxygen graphviz
      - name: Build site
        run: |
          python tools/archmap/archmap.py --out out/site --rev ${{ github.sha }}
          doxygen docs/Doxyfile
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
